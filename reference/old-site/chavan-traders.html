<!doctype html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>चव्हाण ट्रेडर्स – Chavan Traders</title>
<style>
:root{--g:#1f4d33;--btn:#1f4d33;--m:#8b1a2b;--bg:#faf8f3;--c:#fff;--t:#1d1d1b;--b:#ddd8cc;--mu:#6b685f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--c:#1d2b23;--t:#eee9de;--b:#34453b;--m:#e8909e;--g:#8fd6a8;--btn:#2f7a50;--mu:#a9b4ac;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;--c:#1d2b23;--t:#eee9de;--b:#34453b;--m:#e8909e;--g:#8fd6a8;--btn:#2f7a50;--mu:#a9b4ac;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:16px/1.5 "Noto Sans Devanagari","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--c);border-bottom:1px solid var(--b);z-index:5}
.in{max-width:1000px;margin:0 auto;padding:10px 14px}
.brand{font:700 26px/1.1 "Noto Serif Devanagari",Georgia,serif;color:var(--m)}
nav{display:flex;gap:4px;overflow-x:auto;padding-top:6px}
nav button{border:0;background:none;color:var(--t);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{border-color:var(--m);font-weight:600}
h2{font-family:"Noto Serif Devanagari",Georgia,serif;color:var(--g);margin:.2em 0 .5em}
.hero{background:linear-gradient(120deg,#f3e3b0,#e9c46a 55%,#b5833a);color:#2a1b12;padding:34px 14px}
.hero h1{font:700 clamp(34px,8vw,64px)/1.1 "Noto Serif Devanagari",Georgia,serif;color:#7a1224;margin:0}
.hero p{max-width:34em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px}
.prod{font-weight:600;text-align:center;padding:26px 8px;font-size:18px}
.btn,button.p{background:var(--btn);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:none;border:1px solid var(--b);color:var(--t);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--m);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
.k{font:700 24px/1.2 Georgia,serif;color:var(--g)}.neg{color:var(--m)}
.mu{color:var(--mu);font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
footer{background:#1f4d33;color:#e9e4d6;padding:14px;text-align:center;margin-top:30px;font-size:14px}
section{display:none}section.on{display:block}

.brand small{display:block;font:600 11px/1 "Noto Sans Devanagari",system-ui,sans-serif;letter-spacing:.2em;color:var(--g);margin-top:3px}
nav{align-items:center}nav .btn{padding:7px 12px;margin-left:6px}
.hz{background:linear-gradient(100deg,#f8ecc4,#efd48a 60%,#d9a850);color:#2a1b12}
.hzi{display:grid;grid-template-columns:1.1fr 1fr;gap:0;align-items:center;padding:0 14px}
.hzt{padding:34px 0}.hzt h1{font:700 clamp(40px,7vw,72px)/1.05 "Noto Serif Devanagari",Georgia,serif;color:#7a1224;margin:0}
.own{font:600 18px "Noto Serif Devanagari",Georgia,serif;margin:8px 0 14px;border-top:1px solid #7a122455;border-bottom:1px solid #7a122455;display:inline-block;padding:4px 14px}
.hzt p{margin:.4em 0;font-size:17px;max-width:30em}.ct{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.ct a{background:#fff;color:#1d1d1b;border-radius:30px;padding:8px 16px;text-decoration:none;font-weight:600;box-shadow:0 1px 3px #0003}
.hzimg{width:100%;height:100%;min-height:260px;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 22%);mask-image:linear-gradient(to right,transparent,#000 22%)}
.sec{max-width:1000px;margin:0 auto;padding:34px 14px 0}.sec h2{text-align:center}
.pc{padding:0;overflow:hidden;text-align:center}.pc img{width:100%;height:110px;object-fit:cover;display:block}
.pc div{padding:10px 6px;font-weight:600}.pc small{display:block;color:var(--mu);font-weight:400}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tr{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--g);font-weight:600}
.lg{max-width:380px;margin:40px auto;padding:0 14px}.err{color:var(--m);min-height:1.4em;font-size:14px}
@media(max-width:640px){.hzi{grid-template-columns:1fr}.hzimg{min-height:200px;height:220px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%);mask-image:linear-gradient(to bottom,transparent,#000 22%)}}
input,select,textarea{font-size:16px;min-height:44px}button,.btn{min-height:44px}.btn{display:inline-flex;align-items:center;justify-content:center}.bar .btn,.bar button{flex:1 1 auto}@media(max-width:640px){th,td{padding:8px 6px}.card{padding:12px}}
#invo{position:fixed;inset:0;background:#0009;z-index:30;overflow:auto;padding:12px}
.invb{max-width:640px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
.inv{background:#fff;color:#1d1d1b;max-width:640px;margin:0 auto;border:1px solid #ccc;border-radius:14px;overflow:hidden;font-size:14px;line-height:1.6;font-family:'Noto Sans Devanagari',system-ui,sans-serif}
.inv .ih{background:#fad4d4;border-bottom:1px solid #eba0a0;text-align:center;padding:18px 12px}
.inv .ih b{display:block;font-size:34px;line-height:1.4;font-weight:400;color:#9b2230}.inv .ih i{display:block;font-style:normal;font-size:17px;font-weight:600;color:#111;margin:2px 0 6px}
.inv .ih span{display:block;font-size:13px;color:#555}
.inv .t1{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px}
.inv .t1 b{font-size:20px;white-space:nowrap}
.inv .bd{background:#f8dca3;color:#7a4a00;border-radius:999px;padding:3px 14px;white-space:nowrap;font-size:13px}
.inv .bd.ok{background:#cfe9d6;color:#1f4d33}
.inv .g2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ddd;border-bottom:1px solid #ddd}
.inv .g2>div{padding:10px 16px}.inv .g2>div+div{border-left:1px solid #ddd}
.inv .lb{font-size:12px;color:#777}
.inv .tb{display:grid;grid-template-columns:28px 1fr 64px 52px 78px;gap:4px;padding:8px 16px;align-items:start}
.inv .tb.h{background:#f6f5f1;font-size:12px;color:#555}
.inv .tb.rw{border-bottom:1px solid #e5e2da}
.inv .r{text-align:right}
.inv .sm{font-size:12px;color:#666;line-height:1.5}
.inv .tt{padding:10px 16px}
.inv .tl{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:#555}
.inv .tl.big{border-top:1px solid #ccc;margin-top:6px;padding-top:8px;font-size:18px;font-weight:600;color:#1d1d1b}
.inv .tl.pd{color:#0a6b1e}
.inv .due{display:flex;justify-content:space-between;background:#f8dca3;color:#7a4a00;border-radius:10px;padding:8px 14px;margin:8px 16px;font-weight:600;font-size:16px}
.inv .nt{padding:8px 16px;border-top:1px solid #e5e2da;color:#666;font-size:13px}
.inv .sg{display:flex;justify-content:space-between;padding:34px 16px 10px;font-size:13px;color:#555}
.inv .sg div{border-top:1px solid #777;padding-top:4px;min-width:34%;text-align:center}
.inv .ft{background:#f6f5f1;text-align:center;padding:10px;color:#555;font-size:13px}
#invo{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(max-width:520px){#invo{padding-left:6px;padding-right:6px}#invo .invb button{flex:1 1 45%;min-height:44px}#invo .inv{border-radius:10px;font-size:13px}#invo .inv .ih{padding:14px 8px}#invo .inv .ih b{font-size:28px}#invo .inv .ih i{font-size:15px}#invo .inv .ih span{font-size:12px}#invo .inv .t1{padding:10px 10px}#invo .inv .t1 b{font-size:17px}#invo .inv .g2>div{padding:8px 10px}#invo .inv .tb{grid-template-columns:20px 1fr 52px 44px 64px;gap:3px;padding:8px 10px;font-size:12px}#invo .inv .tt{padding:8px 10px}#invo .inv .due{margin:8px 10px;font-size:15px}#invo .inv .nt{padding:8px 10px;font-size:12px}#invo .inv .sg{padding:28px 10px 8px;font-size:12px}}

function sendBtns(k,b){var a="'"+k+"',"+b.id;return '<button class="p" onclick="showInv('+a+')">View bill</button><button class="btn" onclick="sendTxt('+a+')">WhatsApp Message</button><button class="btn" style="background:#8b1a2b" onclick="sendPdf('+a+')">Send PDF</button>'}
function sentBanner(k){if(!LB||LB.k!=k)return '';var b=S[k].filter(function(x){return x.id==LB.id})[0];if(!b)return '';return '<div class="card" style="border-color:var(--g);margin-bottom:12px"><b>Bill saved – '+esc(b.name)+'</b><div class="mu">Total '+R(total(b))+' · Due '+R(total(b)-b.paid)+(b.phone?'':' · No mobile saved, pick the contact in the app')+'</div><div class="bar">'+sendBtns(k,b)+'<button class="s" onclick="LB=null;render()">Done</button></div></div>'}
function billList(k){var l=S[k].slice().reverse();if(!l.length)return '<p class="mu">No bills yet. Fill the form above and save your first bill.</p>';return l.map(function(b){var t=total(b);return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(b.name)+'</b><span class="mu">'+esc(b.date)+'</span></div><div class="mu">'+esc(b.place)+(b.phone?' · '+esc(b.phone):'')+'</div><div style="margin:6px 0;font-size:14px">'+b.items.map(function(i){return esc(i.p)+(i.g?' ('+esc(i.g)+')':'')+': '+i.kg+' KG × ₹'+i.rate+' = '+R(i.kg*i.rate)}).join('<br>')+(b.ham?'<br>Hamali: − '+R(b.ham):'')+'</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div><div class="mu">Total</div><b>'+R(t)+'</b></div><div><div class="mu">Paid</div><b>'+R(b.paid)+'</b></div><div><div class="mu">Due</div><b class="neg">'+R(t-b.paid)+'</b></div></div><div class="bar">'+sendBtns(k,b)+'<button class="s" onclick="del(\''+k+'\','+b.id+')">Delete</button></div></div>'}).join('')}
function stock(){var a=buyAvg(),s={};PRODS.forEach(function(p){s[p]={b:0,s:0}});S.pur.forEach(function(b){b.items.forEach(function(i){(s[i.p]=s[i.p]||{b:0,s:0}).b+=i.kg})});S.sal.forEach(function(b){b.items.forEach(function(i){(s[i.p]=s[i.p]||{b:0,s:0}).s+=i.kg})});return s}
function dash(){var tp=S.pur.reduce(function(a,b){return a+total(b)},0),ts=S.sal.reduce(function(a,b){return a+total(b)},0),av=buyAvg(),pr=0;
S.sal.forEach(function(b){b.items.forEach(function(i){var x=av[i.p];if(x)pr+=(i.rate-x.amt/x.kg)*i.kg})});
var fb=bal("pur"),cb=bal("sal"),pay=fb.reduce(function(a,x){return a+Math.max(x.due,0)},0),adv=fb.reduce(function(a,x){return a+Math.max(-x.due,0)},0),rec=cb.reduce(function(a,x){return a+Math.max(x.due,0)},0);
var c=function(l,v,cl){return '<div class="card"><div class="mu">'+l+'</div><div class="k '+(cl||"")+'">'+v+'</div></div>'};
return '<div class="in"><h2>Dashboard</h2><div class="grid">'+c("Total purchases",R(tp))+c("Total sales",R(ts))+c("Profit (on goods sold)",R(pr),pr<0?"neg":"")+c("To pay farmers",R(pay))+c("To receive from clients",R(rec))+c("Advance given to farmers",R(adv))+'</div><div class="bar" style="margin-top:16px"><button class="s" onclick="exp()">Download backup</button><label class="btn" style="margin:0;color:#fff">Restore backup<input type="file" accept=".json" style="display:none" onchange="imp(this)"></label></div><p class="mu">Data is saved in this browser only. Download a backup regularly.</p></div>'}
function exp(){var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="chavan-traders-backup-"+today()+".json";a.click()}
function imp(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=Object.assign({pur:[],sal:[],pay:[],calls:[]},JSON.parse(r.result));save();render()}catch(e){alert("This file is not a valid backup.")}};r.readAsText(f)}
function balTable(k){var l=bal(k);if(!l.length)return '<p class="mu">No balances yet.</p>';return '<div class="tw"><table><tr><th>Name</th><th>Billed</th><th>Paid</th><th>'+(k=="pur"?"Balance (to pay)":"Balance (to receive)")+'</th></tr>'+l.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+R(x.bill)+'</td><td>'+R(x.paid)+'</td><td class="'+(x.due<0?"neg":"")+'">'+(x.due<0?"Advance "+R(-x.due):R(x.due))+'</td></tr>'}).join("")+'</table></div>'}
function addPay(){var n=$("pn").value.trim(),a=parseFloat($("pa").value);if(!n||!(a>0)){alert("Enter a name and an amount.");return}S.pay.push({id:Date.now(),date:$("pd").value,type:$("pt").value,name:n,amt:a,kind:$("pk").value});save();render()}
function addCall(){var n=$("cn").value.trim();if(!n){alert("Enter the caller name.");return}S.calls.push({id:Date.now(),date:today(),name:n,phone:$("cm").value,prod:$("cp").value,kg:$("ck").value,loc:$("cl").value});save();render()}
function render(){var h="";
if(tab=="home")h=homeHtml();
else if(tab=="login")h=loginHtml();
else if(tab=="dash")h=dash();
else if(tab=="pur"||tab=="sal"){var k=tab;h='<div class="in">'+sentBanner(k)+billForm(k)+'<h2 style="margin-top:20px">Bills</h2>'+billList(k)+'<h2 style="margin-top:20px">'+(k=="pur"?"Farmer balances":"Client balances")+'</h2>'+balTable(k)+'</div>'}
else if(tab=="pay"){var pl=S.pay.slice().reverse();h='<div class="in"><div class="card"><h2>Record a payment</h2><div class="f"><div><label>Date</label><input id="pd" type="date" value="'+today()+'"></div><div><label>Party</label><select id="pt"><option value="farmer">Farmer (I paid)</option><option value="client">Client (I received)</option></select></div><div><label>Name</label><input id="pn" list="pl"><datalist id="pl">'+names("pur").concat(names("sal")).map(function(n){return "<option>"+esc(n)+"</option>"}).join("")+'</datalist></div><div><label>Amount (₹)</label><input id="pa" type="number" min="0"></div><div><label>Type</label><select id="pk"><option>Payment</option><option>Advance</option></select></div></div><button class="p" onclick="addPay()">Save payment</button></div><h2 style="margin-top:20px">Farmers – balance</h2>'+balTable("pur")+'<h2 style="margin-top:20px">Clients – balance</h2>'+balTable("sal")+'<h2 style="margin-top:20px">Payment history</h2>'+(pl.length?'<div class="tw card"><table><tr><th>Date</th><th>Party</th><th>Name</th><th>Amount</th><th>Type</th><th></th></tr>'+pl.map(function(p){return '<tr><td>'+esc(p.date)+'</td><td>'+p.type+'</td><td>'+esc(p.name)+'</td><td>'+R(p.amt)+'</td><td>'+p.kind+'</td><td><button class="s" onclick="del(\'pay\','+p.id+')">✕</button></td></tr>'}).join("")+'</table></div>':'<p class="mu">No payments recorded yet.</p>')+'</div>'}
else if(tab=="stock"){var s=stock(),av=buyAvg();h='<div class="in"><h2>Stock</h2><div class="card tw"><table><tr><th>Product</th><th>Bought</th><th>Sold</th><th>In stock</th><th>Avg buy rate/KG</th><th>Total price</th></tr>'+Object.keys(s).map(function(p){var x=s[p],a=av[p];return '<tr><td>'+p+'</td><td>'+K(x.b)+'</td><td>'+K(x.s)+'</td><td class="'+(x.b-x.s<0?"neg":"")+'"><b>'+K(x.b-x.s)+'</b></td><td>'+(a?R(a.amt/a.kg):"–")+'</td><td><b>'+(a?R((x.b-x.s)*a.amt/a.kg):"–")+'</b></td></tr>'}).join("")+'<tr><td colspan="5"><b>Total stock value</b></td><td><b>'+R(Object.keys(s).reduce(function(t,p){var a=av[p];return t+(a?(s[p].b-s[p].s)*a.amt/a.kg:0)},0))+'</b></td></tr></table></div></div>'}
else{var cl=S.calls.slice().reverse();h='<div class="in"><div class="card"><h2>Log a call</h2><div class="f"><div><label>Who called</label><input id="cn"></div><div><label>Mobile</label><input id="cm" type="tel"></div><div><label>Product</label><select id="cp">'+opts()+'</select></div><div><label>Quantity (KG)</label><input id="ck" type="number" min="0"></div><div><label>Location</label><input id="cl"></div></div><button class="p" onclick="addCall()">Save reminder</button></div><h2 style="margin-top:20px">Call reminders</h2>'+(cl.length?'<div class="card tw"><table><tr><th>Date</th><th>Name</th><th>Product</th><th>KG</th><th>Location</th><th></th></tr>'+cl.map(function(c){return '<tr><td>'+esc(c.date)+'</td><td>'+esc(c.name)+'<div class="mu">'+esc(c.phone)+'</div></td><td>'+esc(c.prod)+'</td><td>'+esc(c.kg)+'</td><td>'+esc(c.loc)+'</td><td><button class="s" onclick="del(\'calls\','+c.id+')">✕</button></td></tr>'}).join("")+'</table></div>':'<p class="mu">No calls logged. Save a caller here so you can see who called, how many KG, and where.</p>')+'</div>'}
$("app").innerHTML=h}
nav();render();
</script></body></html>
