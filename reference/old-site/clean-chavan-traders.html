.inv .due{display:flex;justify-content:space-between;background:#f8dca3;color:#7a4a00;border-radius:10px;padding:8px 14px;margin:8px 16px;font-weight:600;font-size:16px}

#invo{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}

<header><div class="in"><div class="brand" onclick="go('home')" style="cursor:pointer">चव्हाण ट्रेडर्स<small>CHAVAN TRADERS</small></div>

<script>
var TABS=[["home","Home"],["dash","Dashboard"],["pur","Farmer Purchase"],["sal","Client Sale"],["pay","Payments"],["stock","Stock"],["calls","Calls"]];
var PRODS=["Rice","Soybean","Cashew","Groundnut","Nachni","Other"];
const IM={"hero": "BASE64_IMAGE_DATA", "p": ["BASE64_IMAGE_DATA", "BASE64_IMAGE_DATA", "BASE64_IMAGE_DATA", "BASE64_IMAGE_DATA", "BASE64_IMAGE_DATA", "BASE64_IMAGE_DATA"]};
var authed=false;try{authed=sessionStorage.getItem("ct1auth")=="1"}catch(e){}
var S={pur:[],sal:[],pay:[],calls:[]},tab="home";
try{var d=localStorage.getItem("ct1");if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}
function save(){try{localStorage.setItem("ct1",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function R(n){return "₹"+Math.round(n||0).toLocaleString("en-IN")}
function K(n){return (Math.round(n*100)/100).toLocaleString("en-IN")+" KG"}
function today(){return new Date().toISOString().slice(0,10)}
function total(b){return b.items.reduce(function(a,i){return a+i.kg*i.rate},0)-(b.ham||0)}
function names(k){var o={};S[k].forEach(function(b){o[b.name]=1});return Object.keys(o)}
function buyAvg(){var a={};S.pur.forEach(function(b){b.items.forEach(function(i){var x=a[i.p]||(a[i.p]={kg:0,amt:0});x.kg+=i.kg;x.amt+=i.kg*i.rate})});return a}
var WA="https://wa.me/919850815527";
function nav(){var h;if(authed)h=TABS.map(function(t){return '<button class="'+(t[0]==tab?"on":"")+'" onclick="go(\''+t[0]+'\')">'+(t[0]=="home"?"Public site":t[1])+'</button>'}).join("")+'<button class="s" onclick="logout()">Logout</button>';
else h='<button class="'+(tab=="home"?"on":"")+'" onclick="go(\'home\')">Home</button><button onclick="sc(\'products\')">Products</button><button onclick="sc(\'about\')">About Us</button><button onclick="sc(\'contact\')">Contact Us</button><a class="btn" style="background:#8b1a2b" target="_blank" rel="noopener" href="'+WA+'">WhatsApp</a><button class="p" style="margin-left:6px" onclick="go(\'login\')">Login</button>';
$("nav").innerHTML=h}
function go(t){if(t!="home"&&t!="login"&&!authed)t="login";if(t=="login"&&authed)t="dash";tab=t;nav();render();window.scrollTo(0,0)}
function sc(id){if(tab!="home"){tab="home";nav();render()}setTimeout(function(){var e=$(id);if(e)e.scrollIntoView({behavior:"smooth"})},30)}
function logout(){authed=false;try{sessionStorage.removeItem("ct1auth")}catch(e){}go("home")}
function pw(){try{return localStorage.getItem("ct1pw")}catch(e){return null}}
async function H(s){if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ct:"+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}return btoa(unescape(encodeURIComponent("ct:"+s)))}
function lm(m){$("lm").textContent=m}
async function doLogin(){var a=$("lp").value;if(!pw()){if(a.length<4){lm("Password must be at least 4 characters.");return}if(a!=$("lp2").value){lm("The two passwords do not match.");return}try{localStorage.setItem("ct1pw",await H(a))}catch(e){}}else if(await H(a)!=pw()){lm("Wrong password. Try again.");return}
authed=true;try{sessionStorage.setItem("ct1auth","1")}catch(e){}go("dash")}
function resetPw(){$('lm').innerHTML='Owner mobile number: <input id="rm" type="tel" style="margin:6px 0"><button class="p" onclick="resetGo()">Reset password</button>'}
function resetGo(){var m=$('rm').value.trim();if(m=='9765941078'||m=='9850815527'){try{localStorage.removeItem('ct1pw')}catch(e){}render()}else toast('That number does not match.')}
function loginHtml(){var first=!pw();return '<div class="lg"><div class="card"><h2>'+(first?"Create owner password":"Owner login")+'</h2><p class="mu">'+(first?"Choose a password for the billing and stock area. You will use it each time you open it.":"Enter your password to open billing, stock and payments.")+'</p><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==\'Enter\')doLogin()">'+(first?'<label style="margin-top:8px">Confirm password</label><input id="lp2" type="password" onkeydown="if(event.key==\'Enter\')doLogin()">':'')+'<div class="err" id="lm"></div><button class="p" onclick="doLogin()">'+(first?"Create password and open":"Login")+'</button>'+(first?'':' <button class="s" onclick="resetPw()">Forgot password?</button>')+'</div></div>'}
function homeHtml(){var P=[["भात","Rice"],["सोयाबीन","Soybean"],["काजू बी","Cashew"],["शेंगा","Groundnut"],["नाचणी","Finger Millet (Nachani)"],["इतर धान्ये","Other Grains"]];
return `<div class="hz"><div class="in hzi"><div class="hzt"><h1>चव्हाण ट्रेडर्स</h1><div class="own">कै. श्री. रमेश कृष्णा चव्हाण</div><p>आमच्याकडे भात, सोयाबीन, काजू बी, शेंगा, नाचणी आणि इतर सर्व प्रकारच्या धान्यांची खरेदी विक्री केली जाईल.</p><div class="ct"><a href="tel:9765941078">📞 9765941078</a><a target="_blank" rel="noopener" href="${WA}">💬 9850815527</a></div><p>📍 मु.पो. उत्तूर, तळेगळ्ळी, ता. आजरा, जि. कोल्हापूर.</p></div><img class="hzimg" src="${IM.hero}" alt="Rice, soybean, cashew, groundnut and nachni in sacks and bowls"></div></div>
<div class="sec" id="products"><h2>Our Products</h2><p class="mu" style="text-align:center;margin-top:-6px">Quality grains and seeds for a better tomorrow</p><div class="grid">${P.map(function(p,i){return `<div class="card pc"><img src="${IM.p[i]}" alt="${p[1]}"><div>${p[0]}<small>${p[1]}</small></div></div>`}).join("")}</div></div>
<div class="sec"><div class="g3"><div class="card" id="about"><h2 style="text-align:left">About Chavan Traders</h2><p>Chavan Traders is a trusted name in the trading of agricultural products. We are committed to providing quality grains, seeds and pulses with honesty and reliability, and we build long-term relationships with farmers and clients through fair dealing and excellent service.</p><div class="tr"><span>✔ Quality products</span><span>✔ Trusted business</span><span>✔ Customer satisfaction</span></div></div>
<div class="card" id="contact"><h2 style="text-align:left">Contact Us</h2><p>📞 <a href="tel:9765941078">9765941078</a> (साहिल चव्हाण)<br>💬 <a target="_blank" rel="noopener" href="${WA}">9850815527</a> (तन्मय चव्हाण)<br>📍 मु.पो. उत्तूर, तळेगळ्ळी, ता. आजरा, जि. कोल्हापूर.</p><a class="btn" target="_blank" rel="noopener" href="${WA}">Chat on WhatsApp</a></div>
<div class="card"><h2 style="text-align:left">Location</h2><p>Uttur, Tal. Ajra, Dist. Kolhapur, Maharashtra</p><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Uttur+Ajra+Kolhapur">View on Google Maps</a></div></div></div>`}
function opts(){return PRODS.map(function(p){return "<option>"+p+"</option>"}).join("")}
function rowHtml(){return '<div class="row"><select class="ip" onchange="oth(this)">'+opts()+'</select><input class="io" placeholder="Type product name" style="display:none"><input class="ig" placeholder="Grade (optional)"><input class="iw" placeholder="Bag weights: 34 38 33 …"><input class="ic" type="number" min="0" step="any" placeholder="Cut KG"><input class="ir" type="number" min="0" step="any" placeholder="₹ per KG"></div>'}
function addRow(k){$("rows"+k).insertAdjacentHTML("beforeend",rowHtml())}
function billForm(k){var who=k=="pur"?"Farmer":"Client";
return '<div class="card"><h2>'+(k=="pur"?"New farmer purchase bill":"New client sale bill")+'</h2><div class="f"><div><label>Date</label><input id="d'+k+'" type="date" value="'+today()+'"></div><div><label>'+who+' name</label><input id="n'+k+'" list="l'+k+'" onchange="fillP(\''+k+'\')"><datalist id="l'+k+'">'+names(k).map(function(n){return "<option>"+esc(n)+"</option>"}).join("")+'</datalist></div><div><label>Mobile</label><input id="m'+k+'" type="tel"></div><div><label>Village / location</label><input id="v'+k+'"></div></div><p class="mu">Type each bag weight in KG with spaces (34 38 33 …), Marathi digits also work. Cut = deduction in KG. Add one product row per grade, each with its own rate.</p><div id="rows'+k+'">'+rowHtml()+'</div><div class="bar"><button class="s" onclick="addRow(\''+k+'\')">+ Add product</button></div><div class="f" style="margin-top:10px"><div><label>Hamali / other cut (₹)</label><input id="h'+k+'" type="number" min="0" value="0"></div><div><label>'+(k=="pur"?"Paid now":"Received now")+' (₹, leave 0 if later)</label><input id="p'+k+'" type="number" min="0" value="0"></div></div><button class="p" onclick="saveBill(\''+k+'\')">Save bill</button></div>'}
function saveBill(k){var items=[];document.querySelectorAll("#rows"+k+" .row").forEach(function(r){var w=r.querySelector(".iw").value.replace(/[०-९]/g,function(c){return c.charCodeAt(0)-2406}).split(/[\s,+]+/).map(parseFloat).filter(function(x){return x>0}),ct=parseFloat(r.querySelector(".ic").value)||0,rt=parseFloat(r.querySelector(".ir").value),q=w.reduce(function(a,x){return a+x},0)-ct;if(q>0&&rt>=0)items.push({p:(r.querySelector(".ip").value=="Other"&&r.querySelector(".io").value.trim())?r.querySelector(".io").value.trim():r.querySelector(".ip").value,g:r.querySelector(".ig").value.trim(),bags:w,cut:ct,kg:q,rate:rt})});
var n=$("n"+k).value.trim();if(!n||!items.length){alert("Enter a name and at least one product with quantity and rate.");return}
S[k].push({id:Date.now(),date:$("d"+k).value,name:n,phone:$("m"+k).value.replace(/\D/g,""),place:$("v"+k).value,items:items,paid:parseFloat($("p"+k).value)||0,ham:parseFloat($("h"+k).value)||0});save();LB={k:k,id:S[k][S[k].length-1].id};render();window.scrollTo(0,0)}
var CF=null;
function del(k,id){var key=k+id,bt=window.event&&window.event.target;if(bt&&bt.closest)bt=bt.closest('button');if(CF!=key){CF=key;if(bt){bt.dataset.o=bt.textContent;bt.textContent='Tap again to delete';bt.style.background='#8b1a2b';bt.style.color='#fff'}setTimeout(function(){if(CF==key){CF=null;if(bt&&bt.dataset.o){bt.textContent=bt.dataset.o;bt.style.background='';bt.style.color=''}}},4000);return}CF=null;S[k]=S[k].filter(function(x){return x.id!=id});save();render()}
function paidOf(k,b){var t=k=="pur"?"farmer":"client";return b.paid+S.pay.filter(function(p){return p.type==t&&p.name==b.name}).reduce(function(a,p){return a+p.amt},0)*0}
function bal(k){var t=k=="pur"?"farmer":"client",o={};S[k].forEach(function(b){var x=o[b.name]||(o[b.name]={name:b.name,phone:b.phone,place:b.place,bill:0,paid:0,adv:0});x.bill+=total(b);x.paid+=b.paid;if(b.phone)x.phone=b.phone});

else if(tab=="pay"){var pl=S.pay.slice().reverse();h='<div class="in"><div class="card"><h2>Record a payment</h2><div class="f"><div><label>Date</label><input id="pd" type="date" value="'+today()+'"></div><div><label>Party</label><select id="pt"><option value="farmer">Farmer (I paid)</option><option value="client">Client (I received)</option></select></div><div><label>Name</label><input id="pn" list="pl"><datalist id="pl">'+names("pur").concat(names("sal")).map(function(n){return "<option>"+esc(n)+"</option>"}).join("")+'</datalist></div><div><label>Amount (₹)</label><input id="pa" type="number" min="0"></div><div><label>Type</label><select id="pk"><option>Payment</option><option>Advance</option></select></div></div><button class="p" onclick="addPay()">Save payment</button></div><h2 style="margin-top:20px">Farmers – balance</h2>'+balTable("pur")+'<h2 style="margin-top:20px">Clients – balance</h2>'+balTable("sal")+'<h2 style="margin-top:20px">Payment history</h2>'+(pl.length?'<div class="tw card"><table><tr><th>Date</th><th>Party</th><th>Name</th><th>Amount</th><th>Type</th><th></th></tr>'+pl.map(function(p){return '<tr><td>'+esc(p.date)+'</td><td>'+p.type+'</td><td>'+esc(p.name)+'</td><td>'+R(p.amt)+'</td><td>'+p.kind+'</td><td><button class="s" onclick="del(\'pay\','+p.id+')">✕</button></td></tr>'}).join("")+'</table></div>':'<p class="mu">No payments recorded yet.</p>')+'</div>'}
else if(tab=="stock"){var s=stock(),av=buyAvg();h='<div class="in"><h2>Stock</h2><div class="card tw"><table><tr><th>Product</th><th>Bought</th><th>Sold</th><th>In stock</th><th>Avg buy rate/KG</th><th>Total price</th></tr>'+Object.keys(s).map(function(p){var x=s[p],a=av[p];return '<tr><td>'+p+'</td><td>'+K(x.b)+'</td><td>'+K(x.s)+'</td><td class="'+(x.b-x.s<0?"neg":"")+'"><b>'+K(x.b-x.s)+'</b></td><td>'+(a?R(a.amt/a.kg):"–")+'</td><td><b>'+(a?R((x.b-x.s)*a.amt/a.kg):"–")+'</b></td></tr>'}).join("")+'<tr><td colspan="5"><b>Total stock value</b></td><td><b>'+R(Object.keys(s).reduce(function(t,p){var a=av[p];return t+(a?(s[p].b-s[p].s)*a.amt/a.kg:0)},0))+'</b></td></tr></table></div></div>'}
else{var cl=S.calls.slice().reverse();h='<div class="in"><div class="card"><h2>Log a call</h2><div class="f"><div><label>Who called</label><input id="cn"></div><div><label>Mobile</label><input id="cm" type="tel"></div><div><label>Product</label><select id="cp">'+opts()+'</select></div><div><label>Quantity (KG)</label><input id="ck" type="number" min="0"></div><div><label>Location</label><input id="cl"></div></div><button class="p" onclick="addCall()">Save reminder</button></div><h2 style="margin-top:20px">Call reminders</h2>'+(cl.length?'<div class="card tw"><table><tr><th>Date</th><th>Name</th><th>Product</th><th>KG</th><th>Location</th><th></th></tr>'+cl.map(function(c){return '<tr><td>'+esc(c.date)+'</td><td>'+esc(c.name)+'<div class="mu">'+esc(c.phone)+'</div></td><td>'+esc(c.prod)+'</td><td>'+esc(c.kg)+'</td><td>'+esc(c.loc)+'</td><td><button class="s" onclick="del(\'calls\','+c.id+')">✕</button></td></tr>'}).join("")+'</table></div>':'<p class="mu">No calls logged. Save a caller here so you can see who called, how many KG, and where.</p>')+'</div>'}
$("app").innerHTML=h}
nav();render();
</script></body></html>
